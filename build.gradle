plugins {
    id 'java'
    id 'application'
}

group = 'put.plane.boarding'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':simulator')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'put.plane.boarding.PlaneBoardingApplication'
}

test {
    useJUnitPlatform()
}